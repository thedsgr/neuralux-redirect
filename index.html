<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralUX — Redirecionando...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #D85A30;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            font-size: 0.95rem;
            color: #aaa;
        }
        .error {
            color: #D85A30;
            display: none;
            margin-top: 1rem;
        }
        a { color: #D85A30; }
    </style>
</head>
<body>
    <div class="container">
        <h1>NeuralUX</h1>
        <p class="subtitle">UX Brain Analyzer</p>
        <div class="spinner" id="spinner"></div>
        <p class="status" id="status">Conectando ao servidor...</p>
        <p class="error" id="error">
            O servidor ainda nao esta online.<br>
            Inicie o notebook no Google Colab e tente novamente.
        </p>
    </div>

    <script>
        const GIST_ID = '397ef638ef931f3ace318e891a741312';
        const GIST_URL = `https://api.github.com/gists/${GIST_ID}`;

        async function redirect() {
            try {
                const res = await fetch(GIST_URL, { cache: 'no-store' });
                const data = await res.json();
                const content = JSON.parse(data.files['gradio_url.json'].content);

                if (content.url && !content.url.includes('placeholder')) {
                    document.getElementById('status').textContent = 'Servidor encontrado! Redirecionando...';
                    setTimeout(() => { window.location.href = content.url; }, 800);
                } else {
                    showOffline();
                }
            } catch (e) {
                showOffline();
            }
        }

        function showOffline() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        redirect();
    </script>
</body>
</html>
